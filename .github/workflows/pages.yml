# Publishes the built website (teseract-website/dist, built and checked locally with scripts/build.py + check.py)
# to GitHub Pages on every push to main, so the latest version can be tested on a phone.
name: Deploy site to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: teseract-website/dist
      - id: deployment
        uses: actions/deploy-pages@v4
